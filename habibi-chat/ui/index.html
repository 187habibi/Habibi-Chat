<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habibi Chat</title>
  <style>
    :root {
      --accent: #40e0d0;
      --text: #effffd;
      --text-dim: rgba(205, 245, 240, .66);
      --edge: rgba(150, 255, 238, .22);
      --edge-top: rgba(225, 255, 251, .32);
      --glass: linear-gradient(150deg, rgba(14, 66, 72, .86), rgba(4, 26, 32, .92));
      --glass-row: linear-gradient(100deg, rgba(14, 64, 70, .72), rgba(4, 26, 32, .68) 60%, rgba(2, 18, 22, .52));
      --font: 'Inter', system-ui, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-kerning: normal; margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; color: var(--text); font: 500 12.5px var(--font); }

    main { position: absolute; top: 13vh; left: 16px; width: min(520px, calc(100vw - 32px)); transition: opacity .35s cubic-bezier(.33, 0, .2, 1), transform .35s cubic-bezier(.33, 0, .2, 1); }
    body.ui-hidden main { opacity: 0; transform: translateY(-10px); pointer-events: none; }

    /* ---------- wiadomosci ---------- */
    #messages { display: flex; flex-direction: column; gap: 5px; max-height: 20vh; overflow: auto; padding: 4px 2px; opacity: 1; transition: opacity .45s ease; }
    #messages.is-fading { opacity: 0; }
    /* wiadomosc po wejsciu "osiada": jej animacje nie odpalaja sie ponownie, gdy historia wraca */
    #messages .row.settled, #messages .row.settled strong { animation: none; }

    .row {
      --accent: #94a3b8;
      position: relative; display: flex; align-items: baseline; gap: 8px;
      min-height: 30px; padding: 6px 12px 6px 14px;
      background: var(--glass-row);
      border: 1px solid var(--edge); border-radius: 10px;
      box-shadow: inset 0 1px 0 var(--edge-top), 0 2px 5px rgba(0, 14, 18, .22);
      color: var(--text); font-weight: 600; line-height: 1.4;
      white-space: pre-wrap; overflow-wrap: anywhere;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .7);
      animation: messageIn .22s ease-out both;
    }
    /* kolorowy pasek kanalu po lewej */
    .row::before {
      content: ''; position: absolute; left: 5px; top: 7px; bottom: 7px; width: 3px;
      border-radius: 3px; background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }
    .row strong {
      flex: none; padding: 2px 7px; border-radius: 6px;
      background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14);
      color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .06em; line-height: 1.3;
      text-shadow: none; position: relative; top: -1px;
    }
    .row[data-rp="true"] { font-style: italic; color: #dffcf8; }
    .row[data-rp="true"] strong { font-style: normal; background: rgba(64, 224, 208, .16); border-color: rgba(64, 224, 208, .45); color: #7ff5e8; }
    /* TRY - animacje: blysk wyniku na czacie, losowanie i odsloniecie w dymku */
    
    .row[data-label="TRY"] strong { animation: tryPop .3s ease-out .1s both; }
    /* wynik /try na czacie - ten sam co w dymku nad glowa */
    .try-result { flex: none; display: inline-block; font-style: normal; font-weight: 800; color: var(--accent); animation: tryPop .3s ease-out both; }
    .try-result.is-rolling { animation: tryShake .3s ease-in-out infinite; }
    @keyframes tryPop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .rp-overhead.is-rolling .rp-overhead-badge { animation: tryShake .3s ease-in-out infinite; }
    .rp-overhead.is-rolling .rp-overhead-text { opacity: .8; }
    .rp-overhead.is-rolling .rp-overhead-badge { background: rgba(64, 224, 208, .2); border-color: rgba(64, 224, 208, .55); color: #7ff5e8; }
    @keyframes tryShake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
    
    .rp-overhead.is-revealed .rp-overhead-badge { animation: tryPop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
    .rp-overhead-ok { --try-glow: rgba(74, 222, 128, .7); }
    .rp-overhead-fail { --try-glow: rgba(248, 113, 113, .7); }
    /* TRY - kolor wyniku (zielony / czerwony) z serwera */
    .row[data-label="TRY"] strong { background: rgba(255, 255, 255, .08); border-color: var(--accent); color: var(--accent); }
    .rp-overhead-ok .rp-overhead-badge { background: rgba(74, 222, 128, .2); border-color: rgba(74, 222, 128, .6); color: #86efac; }
    .rp-overhead-fail .rp-overhead-badge { background: rgba(248, 113, 113, .2); border-color: rgba(248, 113, 113, .6); color: #fca5a5; }
    /* DO - ciemniejsza odmiana ME */
    .row[data-label="DO"] { background: linear-gradient(100deg, rgba(6, 36, 42, .82), rgba(2, 16, 20, .78) 60%, rgba(1, 10, 13, .62)); color: #bfe9e3; }
    .row[data-label="DO"]::before { background: #1f9e93; box-shadow: 0 0 6px #1f9e93; }
    .row[data-label="DO"] strong { background: rgba(20, 120, 112, .22); border-color: rgba(31, 158, 147, .5); color: #4fd1c3; }
    /* wlasna wiadomosc: wjazd z dolu, z poswiata */
    .row.is-own { animation: ownIn .22s ease-out both; }
    @keyframes ownIn { from { opacity: 0; transform: translate3d(0, 8px, 0); } to { opacity: 1; transform: none; } }
    @keyframes messageIn { from { opacity: 0; transform: translate3d(-10px, 0, 0); } to { opacity: 1; transform: none; } }
    @keyframes formOut { from { opacity: 1; } to { opacity: 0; transform: translate3d(0, 4px, 0); } }

    /* ---------- pole wpisywania ---------- */
    /* przy zamykaniu pole zachowuje ramke i poswiate, a podpowiedzi zanikaja razem z panelem */
    form.is-closing input { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(64, 224, 208, .16), 0 0 14px rgba(64, 224, 208, .22); }
    form {
      position: relative; margin-top: 6px; padding: 6px;
      background: var(--glass);
      border: 1px solid var(--edge); border-radius: 14px;
      box-shadow: inset 0 1px 0 var(--edge-top), 0 10px 28px rgba(0, 14, 18, .45);
      animation: formIn .18s ease-out both;
      transform-origin: 50% 0;
    }
    form.is-closing { animation: formOut .18s ease-in forwards; will-change: opacity, transform; pointer-events: none; }
    @keyframes formIn { from { opacity: 0; transform: translate3d(0, -6px, 0); } to { opacity: 1; transform: none; } }

    nav { display: flex; align-items: center; gap: 3px; padding: 3px; margin-bottom: 6px; background: rgba(0, 22, 28, .45); border: 1px solid rgba(150, 255, 238, .1); border-radius: 999px; }
    nav button {
      flex: 1 1 0; height: 26px; padding: 0; border: 1px solid transparent; border-radius: 999px;
      background: transparent; color: var(--text-dim);
      font: 700 10.5px var(--font); letter-spacing: .06em; cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    nav button:hover:not(.active) { background: rgba(64, 224, 208, .1); color: var(--text); }
    nav button.active {
      background: linear-gradient(180deg, #4feadb, #1fb3a6); border-color: rgba(220, 255, 250, .7);
      color: #022a2c; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 0 12px rgba(64, 224, 208, .45);
    }
    nav kbd {
      flex: none; margin: 0 6px 0 4px; padding: 2px 6px; border-radius: 5px;
      border: 1px solid rgba(150, 255, 238, .28); border-bottom-width: 2px;
      background: rgba(0, 30, 34, .55); color: #bff8f1; font: 700 9.5px var(--font);
    }

    input {
      width: 100%; height: 36px; padding: 0 12px;
      background: rgba(0, 20, 26, .55); color: var(--text);
      border: 1px solid rgba(150, 255, 238, .22); border-radius: 10px;
      outline: none; font: 600 12.5px var(--font);
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    input::placeholder { color: rgba(205, 245, 240, .45); }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(64, 224, 208, .16), 0 0 14px rgba(64, 224, 208, .22); }

    /* ---------- podpowiedzi komend ---------- */
    #suggestions { margin-top: 6px; max-height: 26vh; overflow-y: auto; border-radius: 10px; background: rgba(0, 18, 22, .6); border: 1px solid rgba(150, 255, 238, .12); }
    #suggestions:empty { display: none; }
    #suggestions > div { padding: 7px 12px; color: var(--text-dim); border-bottom: 1px solid rgba(150, 255, 238, .07); }
    #suggestions > div:last-child { border-bottom: none; }
    
    #suggestions > div.is-selected { background: rgba(64, 224, 208, .16); box-shadow: inset 2px 0 0 #40e0d0; }
    #suggestions > div.is-selected b { color: #b6fff5; }
    #suggestions b { color: #7ff5e8; font-weight: 700; }
    #suggestions em { display: block; margin-top: 1px; color: rgba(205, 245, 240, .55); font-size: 11px; font-style: normal; }

    #messages, #suggestions { scrollbar-width: none; -ms-overflow-style: none; }
    #messages::-webkit-scrollbar, #suggestions::-webkit-scrollbar { display: none; width: 0; height: 0; }
    [hidden] { display: none !important; }

    /* ---------- dymki /me /do nad postacia ---------- */
    #overhead { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .rp-overhead {
      position: absolute; display: flex; align-items: center; gap: 9px;
      width: max-content; max-width: min(480px, 70vw); min-height: 34px;
      padding: 6px 13px 6px 7px; border-radius: 10px;
      background: linear-gradient(150deg, rgba(14, 64, 70, .86), rgba(3, 22, 28, .86));
      border: 1px solid rgba(150, 255, 238, .26);
      box-shadow: inset 0 1px 0 rgba(225, 255, 251, .3), 0 6px 18px rgba(0, 10, 14, .45);
      left: 0; top: 0; will-change: transform;
      transform-origin: 50% 100%;
      color: #fff; font: 600 16px var(--font);
      animation: bubbleIn .2s ease-out backwards;
      opacity: 1; transition: opacity .3s ease;
    }
    @keyframes bubbleIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes bubbleOut { to { opacity: 0; } }
    .rp-overhead.is-hidden { opacity: 0; }
    .rp-overhead.no-enter { animation: none; }
    .rp-overhead.is-leaving { animation: bubbleOut .25s ease-in forwards; }
    .rp-overhead-do { background: linear-gradient(150deg, rgba(6, 36, 42, .9), rgba(1, 12, 16, .9)); border-color: rgba(31, 158, 147, .3); }
    .rp-overhead-do .rp-overhead-badge { background: rgba(20, 120, 112, .24); border-color: rgba(31, 158, 147, .55); color: #4fd1c3; }
    .rp-overhead-do .rp-overhead-text { color: #cdeee9; }
    .rp-overhead-badge {
      flex: none; padding: 3px 7px; border-radius: 6px;
      background: rgba(64, 224, 208, .2); border: 1px solid rgba(64, 224, 208, .55);
      color: #7ff5e8; font: 800 12px var(--font); letter-spacing: .06em;
    }
    .rp-overhead-text { min-width: 0; line-height: 20px; overflow-wrap: anywhere; font-style: italic; text-shadow: 0 1px 3px #000; }
    .rp-overhead-line { position: absolute; left: 50%; top: 100%; width: 1px; height: 38px; background: linear-gradient(rgba(127, 245, 232, .75), rgba(127, 245, 232, .1)); }
    .rp-overhead-line::before { content: ''; position: absolute; left: -2px; top: 0; width: 5px; height: 5px; border-radius: 50%; background: #7ff5e8; box-shadow: 0 0 6px #40e0d0; }
    .rp-overhead-stacked .rp-overhead-line { display: none; }

  </style>
</head>
<body>
  <div id="overhead" aria-hidden="true"></div>
  <main>
    <section id="messages" aria-label="Wiadomości"></section>
    <form hidden>
      <nav aria-label="Kanał czatu">
        <button type="button" class="active" data-filter="all">WSZYSTKIE</button>
        <button type="button" data-filter="ooc">LOOC</button>
        <button type="button" data-filter="admin">ADM</button>
        <kbd title="Tab zmienia kanał">TAB</kbd>
      </nav>
      <input aria-label="Wiadomość" autocomplete="off" maxlength="500" placeholder="Napisz lokalnie lub wpisz /komendę">
      <div id="suggestions"></div>
    </form>
  </main>
  <script src="chat.js"></script>
</body>
</html>
